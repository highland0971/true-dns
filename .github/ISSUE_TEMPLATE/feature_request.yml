name: 功能建议
description: 提出新功能或改进
title: "[feat] "
labels: [enhancement]
body:
  - type: textarea
    id: motivation
    attributes:
      label: 背景与动机
      description: 要解决什么问题，为什么现在需要
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 希望如何实现（命令/配置/行为层面）
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 考虑过但未采纳的方案及其取舍
  - type: checkboxes
    id: scope
    attributes:
      label: 影响范围
      options:
        - label: 核心引擎 (internal/core)
        - label: Windows 平台层
        - label: Linux 平台层
        - label: CLI / 控制 API
        - label: 配置与文档
        - label: GUI (托盘等)
