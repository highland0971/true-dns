name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: gofmt check
        run: test -z "$(gofmt -l cmd internal)"

      - name: cross build (windows + linux)
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -ldflags "-s -w" -o dist/truedns-windows-amd64.exe ./cmd/truedns
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -ldflags "-s -w" -o dist/truedns-linux-amd64 ./cmd/truedns
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 \
            go build -trimpath -ldflags "-s -w" -o dist/truedns-linux-arm64 ./cmd/truedns
          sha256sum dist/* > dist/SHA256SUMS
          cat dist/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: truedns-binaries
          path: dist/
          if-no-files-found: error
