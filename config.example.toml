# true-dns 配置示例 (完整注释版)。
# 生成到默认位置:  truedns config init
# 查看合并后配置:  truedns config show

# ---------------------------------------------------------------------------
# 监听地址: 本地 DNS 代理监听的 UDP+TCP 地址。
# 端口 53 需要管理员权限; 沙箱/开发环境可改用 5353。
# ---------------------------------------------------------------------------
listen = ["127.0.0.1:53", "[::1]:53"]

# ---------------------------------------------------------------------------
# 路由模式:
#   split = 仅命中 domains.polluted 的域名走 DoH 加密上游,
#           其余请求直通系统 DNS —— 对本地网络影响最小 (默认, 推荐)。
#   full  = 所有 DNS 请求都走 DoH 加密上游。
# ---------------------------------------------------------------------------
mode = "split"

# ---------------------------------------------------------------------------
# 被污染域名清单。每个条目自动覆盖其全部子域名
# (github.com 同时匹配 api.github.com / a.b.github.com ...)。
# 也支持 "*.example.com" 形式 (仅子域名) 和 "*" (匹配一切)。
# 内置默认值 = GitHub 生态, 见 config.DefaultPollutedDomains。
# ---------------------------------------------------------------------------
[domains]
polluted = [
  "github.com",
  "github.io",
  "githubusercontent.com",
  "githubassets.com",
  "githubcopilot.com",
  "githubstatus.com",
  "github.blog",
  "github.dev",
  "githubapp.com",
  "github.net",
  "ghcr.io",
  "github.community",
  # GitHub 资产所用 Fastly CDN 子域 (仅具体子域, fastly.net 父域与其他客户共享)。
  "github.map.fastly.net",
  "github.global.ssl.fastly.net",
  # GitHub 所用 S3 存储桶 (仅具体桶, amazonaws.com 父域过宽)。
  "github-cloud.s3.amazonaws.com",
  "github-com.s3.amazonaws.com",
  "github-production-release-asset-2e65be.s3.amazonaws.com",
  "github-production-repository-file-5c1aeb.s3.amazonaws.com",
  "github-production-user-asset-6210df.s3.amazonaws.com",
  # 境外 DoH 域名本身也是被污染目标: 加入清单后, 引擎的 DoH 客户端
  # 解析其主机名时经本代理获得干净 IP, 使备用境外上游真正可用。
  "dns.google",
  "cloudflare-dns.com",
]

# ---------------------------------------------------------------------------
# 上游配置。
# ---------------------------------------------------------------------------
[upstreams]
# DoH (DNS over HTTPS) 加密上游: 查询经 TLS 加密发送, 无法被中途注入伪造应答。
# 默认顺序: 国内可达且对 GitHub 返回真实 IP 的端点在前 (阿里/DNSPod),
# Google/Cloudflare 作为备选 (需 proxy_url 或未受污染的网络)。
# strategy = "race" 时并发询问, 取最快有效应答。
doh = [
  "https://dns.alidns.com/dns-query",
  "https://doh.pub/dns-query",
  "https://dns.google/dns-query",
  "https://cloudflare-dns.com/dns-query",
]
# 多条 DoH 上游的使用策略:
#   race     = 并发询问全部上游, 取最快有效应答 (默认)。
#   failover = 按轮转顺序逐个尝试, 上一个失败才问下一个。
strategy = "race"
# 单次上游查询超时。
timeout = "3s"
# 可选: 访问 DoH 上游所用的 HTTP(S) 代理 (例如本地 Clash/v2ray 的端口)。
# proxy_url = "http://127.0.0.1:7890"
# 非污染域名的系统上游查询失败时, 是否回退到 DoH。
fallback_to_doh = false
# 手动指定非污染域名的明文上游 (留空 = 自动从操作系统发现;
# 接管后原 DNS 会被自动保存并优先使用, 不会用 127.0.0.1 自己问自己)。
# system = ["223.5.5.5", "119.29.29.29"]
# 公共回退链: system 上游全部失败时 (如 VM 虚拟网卡网关无 DNS 服务) 依次兜底,
# 再失败才按 fallback_to_doh 走 DoH。置空可禁用回退链。
fallback = ["223.5.5.5", "119.29.29.29", "1.1.1.1"]

# ---------------------------------------------------------------------------
# 响应缓存。
# ---------------------------------------------------------------------------
[cache]
max_ttl = "1h"      # 缓存 TTL 上限 (真实 TTL 超过此值会被截断)
max_entries = 4096  # 缓存条目上限, LRU 淘汰

# ---------------------------------------------------------------------------
# 本地控制 API (仅监听回环地址), 供托盘 GUI 与 CLI status/flush 使用。
# ---------------------------------------------------------------------------
[api]
enabled = true
listen = "127.0.0.1:5378"
# 端口被系统保留/占用时 (Windows 可能对 5378 报 WSAEACCES), 自动依次尝试
# 15378/25378/35378/45378/随机端口, 实际端口写入 <配置目录>/api-port,
# CLI status/flush 与托盘 GUI 会优先读取该文件发现端口。
# token = "change-me"   # 留空 = 无鉴权 (仅本机可访问); 设置后需携带
#                       # X-TrueDNS-Token 请求头或 ?token= 参数

# ---------------------------------------------------------------------------
# IP 覆盖表 (hosts 格式订阅, 如 GitHub520 的 hosts 清单):
# 命中域名直接应答表中的优选 IP, 等价于动态 hosts 注入, 无需管理员权限;
# 未命中域名不受影响, 仍走正常路由。拉取经系统解析 —— 系统 DNS 已接管时
# 会经本代理获得干净 IP; 也可复用 upstreams.proxy_url。
# ---------------------------------------------------------------------------
[override]
# 远程 hosts 清单 URL (启动时拉取; refresh_interval > 0 时周期刷新)。
# 示例 (GitHub520):
# urls = ["https://raw.githubusercontent.com/521xueweihan/GitHub520/main/hosts"]
urls = []
# 本地 hosts 文件。
files = []
ttl = "5m"              # 覆盖应答的 TTL
refresh_interval = "0s" # "0s" = 仅启动时拉取一次; 如 "2h" 周期刷新

# ---------------------------------------------------------------------------
# EDNS Client Subnet (ECS) 处理。
# ---------------------------------------------------------------------------
[ecs]
# 向 DoH 上游转发时剥离客户端携带的 ECS (保护隐私, 避免境外 CDN
# 按国内出口调度到不合适节点; 默认开)。
strip = true
# 可选: 注入伪造的 ECS 网段用于 CDN 调度调优 (按需修改)。
# spoof = "1.2.3.0/24"

# ---------------------------------------------------------------------------
# 日志。
# ---------------------------------------------------------------------------
[log]
level = "info"           # debug | info | warn | error
verbose_queries = false  # true 时打印每次查询 (需 level = "debug")
stats_interval = "1m"    # 周期统计心跳 (查询数/命中率等); "0s" 关闭
