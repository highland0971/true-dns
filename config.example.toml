# true-dns 配置示例 (完整注释版)。
# 生成到默认位置:  truedns config init
# 查看合并后配置:  truedns config show

# ---------------------------------------------------------------------------
# 监听地址: 本地 DNS 代理监听的 UDP+TCP 地址。
# 端口 53 需要管理员权限; 沙箱/开发环境可改用 5353。
# ---------------------------------------------------------------------------
listen = ["127.0.0.1:53", "[::1]:53"]

# ---------------------------------------------------------------------------
# 路由模式:
#   split = 仅命中 domains.polluted 的域名走 DoH 加密上游,
#           其余请求直通系统 DNS —— 对本地网络影响最小 (默认, 推荐)。
#   full  = 所有 DNS 请求都走 DoH 加密上游。
# ---------------------------------------------------------------------------
mode = "split"

# ---------------------------------------------------------------------------
# 被污染域名清单。每个条目自动覆盖其全部子域名
# (github.com 同时匹配 api.github.com / a.b.github.com ...)。
# 也支持 "*.example.com" 形式 (仅子域名) 和 "*" (匹配一切)。
# 内置默认值 = GitHub 生态, 见 config.DefaultPollutedDomains。
# ---------------------------------------------------------------------------
[domains]
polluted = [
  "github.com",
  "github.io",
  "githubusercontent.com",
  "githubassets.com",
  "githubcopilot.com",
  "githubstatus.com",
  "github.blog",
  "github.dev",
  "githubapp.com",
  "github.net",
  "ghcr.io",
]

# ---------------------------------------------------------------------------
# 上游配置。
# ---------------------------------------------------------------------------
[upstreams]
# DoH (DNS over HTTPS) 加密上游: 查询经 TLS 加密发送, 无法被中途注入伪造应答。
# 默认顺序: 国内可达且对 GitHub 返回真实 IP 的端点在前 (阿里/DNSPod),
# Google/Cloudflare 作为备选 (需 proxy_url 或未受污染的网络)。
# strategy = "race" 时并发询问, 取最快有效应答。
doh = [
  "https://dns.alidns.com/dns-query",
  "https://doh.pub/dns-query",
  "https://dns.google/dns-query",
  "https://cloudflare-dns.com/dns-query",
]
# 多条 DoH 上游的使用策略:
#   race     = 并发询问全部上游, 取最快有效应答 (默认)。
#   failover = 按轮转顺序逐个尝试, 上一个失败才问下一个。
strategy = "race"
# 单次上游查询超时。
timeout = "3s"
# 可选: 访问 DoH 上游所用的 HTTP(S) 代理 (例如本地 Clash/v2ray 的端口)。
# proxy_url = "http://127.0.0.1:7890"
# 非污染域名的系统上游查询失败时, 是否回退到 DoH。
fallback_to_doh = false
# 手动指定非污染域名的明文上游 (留空 = 自动从操作系统发现;
# 接管后原 DNS 会被自动保存并优先使用, 不会用 127.0.0.1 自己问自己)。
# system = ["223.5.5.5", "119.29.29.29"]

# ---------------------------------------------------------------------------
# 响应缓存。
# ---------------------------------------------------------------------------
[cache]
max_ttl = "1h"      # 缓存 TTL 上限 (真实 TTL 超过此值会被截断)
max_entries = 4096  # 缓存条目上限, LRU 淘汰

# ---------------------------------------------------------------------------
# 本地控制 API (仅监听回环地址), 供托盘 GUI 与 CLI status/flush 使用。
# ---------------------------------------------------------------------------
[api]
enabled = true
listen = "127.0.0.1:5378"
# token = "change-me"   # 留空 = 无鉴权 (仅本机可访问); 设置后需携带
#                       # X-TrueDNS-Token 请求头或 ?token= 参数

# ---------------------------------------------------------------------------
# EDNS Client Subnet (ECS) 处理。
# ---------------------------------------------------------------------------
[ecs]
# 向 DoH 上游转发时剥离客户端携带的 ECS (保护隐私, 避免境外 CDN
# 按国内出口调度到不合适节点; 默认开)。
strip = true
# 可选: 注入伪造的 ECS 网段用于 CDN 调度调优 (按需修改)。
# spoof = "1.2.3.0/24"

# ---------------------------------------------------------------------------
# 日志。
# ---------------------------------------------------------------------------
[log]
level = "info"           # debug | info | warn | error
verbose_queries = false  # true 时打印每次查询 (debug 级别)
